[project]
name = "carelens"
version = "0.1.0"
description = "Explainable 30-day hospital readmission risk, fairness auditing, monitoring and a document-grounded policy assistant."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
